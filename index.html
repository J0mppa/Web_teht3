<!DOCTYPE html>
<html lang="fi">
    <head>
        <title>Klikkauspeli</title>
        <link rel="stylesheet" href="style.css">
        <script src="main.js" defer></script>
    </head>

    <body>
        <div id="kauppa">
            <div id="kauppanapit">
                <button type="button" class="autoclicker kauppa">Autoclickerit</button>
                <button type="button" class="paivitys kauppa">Päivitykset</button>
            </div>
            <hr>
            <div id="paivityskauppa">
                <button type="button" class="paivitykset paivitys_1">päivitys 1</button>
                <button type="button" class="paivitykset paivitys_2">päivitys 2</button>
            </div>

            <div id="autoclickerkauppa">
                <button type="button" class="autoclickerit autoclickernappi_1">Osta autoclicker 1 hinta: <span id="hinta_autoclicker_1"></span></button>
                <p>Määrä: <strong id="maara_autoclicker_1"></strong></p>
                <hr>
                <button type="button" class="autoclickerit autoclickernappi_2">Osta autoclicker 2 hinta: <span id="hinta_autoclicker_2"></span></button>
                <p>Määrä: <strong id="maara_autoclicker_2"></strong></p>
                <hr>
            </div>
            
            
        </div>
        <div id="pelialue">
            <button type="button" id="klikkausnappi"></button>
            
        
            <p>Pisteet: <span id="pisteet">0</span></p>
        </div>
        
    </body>
