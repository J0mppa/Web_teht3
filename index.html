<!DOCTYPE html>
<html lang="fi">
    <head>
        <title>Klikkauspeli</title>
        <link rel="stylesheet" href="style.css">
        <script src="main.js" defer></script>
    </head>

    <body>
        <div id="kauppa">
            <div id="kauppanapit">
                <button type="button" class="autoclicker kauppa">Autoclickerit</button>
                <button type="button" class="paivitys kauppa">Päivitykset [<strong id="avoimet_paivitykset"></strong>]</button>
            </div>
            <hr>
            <div id="paivityskauppa">
                <button type="button" class="paivitykset paivitys_1">Tuplaa klikkausten arvo</button>
                <button type="button" class="paivitykset paivitys_2">Tuplaa klikkausten arvo</button>
            </div>

            <div id="autoclickerkauppa">
                <button type="button" class="autoclickerit autoclickernappi_1">Osta autoclicker 1 hinta: <strong id="hinta_autoclicker_1"></strong> 
                    Määrä: <strong id="maara_autoclicker_1"></strong></button>
                
                
                <button type="button" class="autoclickerit autoclickernappi_2">Osta autoclicker 2 hinta:  <strong id="hinta_autoclicker_2"></strong>
                    Määrä: <strong id="maara_autoclicker_2"></strong></button>

                <button type="button" class="autoclickerit autoclickernappi_3">Osta autoclicker 3 hinta:  <strong id="hinta_autoclicker_3"></strong>
                    Määrä: <strong id="maara_autoclicker_3"></strong></button>

                <button type="button" class="autoclickerit autoclickernappi_4">Osta autoclicker 4 hinta:  <strong id="hinta_autoclicker_4"></strong>
                    Määrä: <strong id="maara_autoclicker_4"></strong></button>
                
                
            </div>
            
            
        </div>
        <div id="pelialue">
            <button type="button" id="klikkausnappi"></button>
            
        
            <p>Pisteet: <span id="pisteet">0</span></p>
            
        </div>
        
    </body>
